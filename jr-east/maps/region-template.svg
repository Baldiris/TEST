<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">JR Regional Map Template</title>
  <desc id="desc">Template for Kimagure JR Trip regional SVG maps.</desc>
  <style>
    .route{fill:none;stroke:#9aa29d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .station{fill:#fff;stroke:#4d5650;stroke-width:2}
    .label{font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif;font-size:16px;font-weight:700;fill:#1f2923;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .major-label{font-size:20px;font-weight:900}
    .minor-label{font-size:14px}
    .labels-major-only .minor-label{display:none}
  </style>

  <rect width="1000" height="700" fill="#fffdf8"/>

  <!--
    Example only. Replace with real regional geometry.

    <path class="route" d="M 180 350 L 420 350 L 680 420"/>
    <circle class="station" cx="180" cy="350" r="8" data-station="駅名"/>
    <text class="label major-label" x="180" y="325" text-anchor="middle">駅名</text>
  -->
</svg>
