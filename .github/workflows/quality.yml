name: Quality Check

on:
  push:
    branches:
      - master
      - "feature/kimagure-metro-*"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check HTML element references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html","utf8");
          const js = fs.readFileSync("app.js","utf8");
          const ids = [...js.matchAll(/\$\("([^"]+)"\)/g)].map(m=>m[1]);
          const unique = [...new Set(ids)];
          const missing = unique.filter(id => !new RegExp('id=["\\\']'+id+'["\\\']').test(html));
          if (missing.length) {
            console.error("Missing HTML ids:", missing.join(", "));
            process.exit(1);
          }
          console.log("Validated", unique.length, "HTML id references.");
          NODE

      - name: Check required files
        run: test -s index.html && test -s style.css && test -s app.js

      - name: Test game logic
        run: node tests/logic.test.js

      - name: Test UI contract
        run: node tests/ui-contract.test.js

      - name: Run runtime smoke test
        run: node tests/runtime-smoke.test.js

      - name: Check design competition
        run: node --check design-competition.js && node tests/design-competition.test.js
